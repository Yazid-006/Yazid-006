<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="334" viewBox="0 0 1200 334" role="img" aria-label="About Yazid: full-stack and mobile developer in Cotonou, Benin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
